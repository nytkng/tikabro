# فحص ZAP سلبي (بلا هجوم) على الموقع الحي، كل أسبوع.
name: zap-baseline
on:
  schedule: [{cron: "41 4 * * 0"}]
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://tikabro.thenytkng.workers.dev
          allow_issue_writing: true
          issue_title: "ZAP baseline report"
