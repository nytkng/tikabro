# فحص أمني مجاني: الأسرار (Gitleaks)، الكود (Semgrep CE)، المكتبات (npm audit). ما يوصلش لقاعدة البيانات.
name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "23 3 * * 1"}]
permissions: {contents: read}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact
  code:
    runs-on: ubuntu-latest
    container: {image: semgrep/semgrep}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep CE
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/typescript --error --metrics=off
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
